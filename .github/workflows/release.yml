name: Release
run-name: Release ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Chrome
        run: npm run zip

      - name: Build Firefox
        run: npm run zip:firefox

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-chrome.zip
            dist/*-firefox.zip
            dist/*-sources.zip
          generate_release_notes: true
          draft: false
          prerelease: false