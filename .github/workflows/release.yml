name: Release
run-name: Release ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    defaults:
      run:
        working-directory: ./extension

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './extension/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Chrome
        run: npm run zip

      - name: Build Firefox
        run: npm run zip:firefox

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            extension/dist/*-chrome.zip
            extension/dist/*-firefox.zip
            extension/dist/*-sources.zip
          generate_release_notes: true
          draft: false
          prerelease: false